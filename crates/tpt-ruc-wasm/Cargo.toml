[package]
name = "tpt-ruc-wasm"
description = "wasm-bindgen bindings for tpt-ruc-core, consumed by the PWA"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository = "https://github.com/tpt-solutions/tpt-ruc-nz"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-ruc-core = { path = "../tpt-ruc-core", version = "0.1.0" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
wasm-bindgen-test = "0.3"
