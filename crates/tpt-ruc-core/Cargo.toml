[package]
name = "tpt-ruc-core"
description = "Pure Rust RUC maths, NMEA parsing and distance logic for tpt-ruc-nz (no_std compatible)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["std", "serde"]
std = []
serde = ["dep:serde"]

[dependencies]
libm.workspace = true
serde = { version = "1.0.229", default-features = false, features = ["derive"], optional = true }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
rmp-serde = "1.3.1"
serde_json = "1.0.154"
