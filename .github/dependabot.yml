version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Enabled once pwa/ is scaffolded in Phase 2
  - package-ecosystem: npm
    directory: /pwa
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
