[workspace]
resolver = "2"
exclude = ["firmware/esp"]
members = [
    "crates/tpt-ruc-core",
    "crates/tpt-ruc-wasm",
    "crates/tpt-ruc-firmware",
    "crates/tpt-ruc-backend",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]

[workspace.dependencies]
libm = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release builds favour small size, which matters for the wasm module the PWA downloads.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
